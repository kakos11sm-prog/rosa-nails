<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Кабінет студії</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-login">
    <p class="eyebrow">Lissa Nails</p>
    <h1>Кабінет студії</h1>
    <p class="lede">Після входу відкриється звичайний сайт. Затисни або натисни на текст чи фото — і можна міняти.</p>
    <form id="loginForm">
      <label>Пароль
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p class="form-hint status-error" id="loginError" hidden></p>
      <button class="btn btn-wide" type="submit">Увійти на сайт</button>
    </form>
  </div>
  <script src="/static/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROSA — статус заявки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600;1,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <a class="logo" href="/"><span class="logo-word">Lissa Nails</span><span class="logo-spark" aria-hidden="true"></span></a>
    <a class="btn btn-sm" href="/book">Новий запис</a>
  </header>
  <main class="band band-blush" id="statusBand">
    <div class="wrap status-box">
      <div class="status-scene is-wait" id="statusScene" data-state="wait" aria-hidden="true">
        <div class="status-sparks" id="statusSparks">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="status-seal">
          <svg viewBox="0 0 140 140" fill="none">
            <circle class="seal-halo" cx="70" cy="70" r="62" />
            <circle class="seal-track" cx="70" cy="70" r="50" />
            <circle class="seal-ring" cx="70" cy="70" r="50" />
            <path class="seal-check" d="M44 72.5 L61 89 L98 50" />
            <path class="seal-x a" d="M50 50 L90 90" />
            <path class="seal-x b" d="M90 50 L50 90" />
          </svg>
          <div class="status-dots">
            <i></i><i></i><i></i>
          </div>
        </div>
      </div>
      <p class="eyebrow" id="statusEye">Заявка</p>
      <h1 id="statusTitle">Перевіряємо…</h1>
      <p id="statusLead" class="lede"></p>
      <dl class="status-facts" id="statusFacts" hidden></dl>
      <div id="statusOffers" hidden></div>
      <p class="form-hint status-error" id="statusError" hidden></p>
      <a class="btn" id="statusCta" href="/book">Записатись на інший час</a>
    </div>
  </main>
  <script src="/static/remember.js"></script>
  <script src="/static/status.js"></script>
</body>
</html>
